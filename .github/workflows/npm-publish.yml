name: Publish

on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  build:
    needs: checks
    runs-on: ubuntu-latest

    permissions:
      contents: read
      # https://docs.npmjs.com/generating-provenance-statements#publishing-packages-with-provenance-via-github-actions
      id-token: write

    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0
          lfs: true
      - name: Configure Node.js
        uses: actions/setup-node@v4.1.0
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org/

      - run: corepack enable

      - run: yarn install --immutable

      - name: Check release version and choose npm tag
        id: release
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const version = require('./package.json').version;
          if (process.env.GITHUB_EVENT_NAME === 'release' && process.env.GITHUB_REF_NAME !== `v${version}`) {
            throw new Error(`Release tag must be v${version}`);
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `tag=${version.includes('-') ? 'next' : 'latest'}\n`);
          NODE

      - run: npm publish --provenance --access public --tag "${{ steps.release.outputs.tag }}"
        env:
          NODE_AUTH_TOKEN: ${{secrets.NPM_ORG_TOKEN}}
