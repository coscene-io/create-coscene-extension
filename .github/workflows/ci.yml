name: CI

on:
  workflow_call:
  push:
    branches: main
    tags: v*
  pull_request:
    branches: "*"

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4.2.2

      - run: corepack enable

      - name: Configure Node.js
        uses: actions/setup-node@v4.1.0
        with:
          node-version: 24.x
          cache: yarn

      - run: yarn install --immutable
      - run: yarn run tsc --noEmit # typecheck files that are not included by webpack or package builds
      - run: yarn lint:ci

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4.2.2

      - run: corepack enable

      - name: Configure Node.js
        uses: actions/setup-node@v4.1.0
        with:
          node-version: 24.x
          cache: yarn

      - run: yarn install --immutable
      - name: test
        run: yarn run test --maxWorkers=100%

  e2e:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-latest
          - windows-2022

    name: e2e (${{ matrix.os }})

    steps:
      - uses: actions/checkout@v4.2.2

      - name: Configure Node.js
        uses: actions/setup-node@v4.1.0
        with:
          node-version: 24.x

      - run: corepack enable

      - run: yarn install --immutable

      # The test installs this tarball in temporary projects. Nothing needs to be published first.
      - run: yarn pack

      - name: Verify generated extension and all examples with this tarball
        run: yarn test:e2e package.tgz --examples
